title: ASVD Protocol
name: asvd
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Independent Variables
        children:
          - type: VariablesListBox
            name: indeps
            isTarget: true

  # СЕКЦИЯ 1: Шаг анализа
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: step

  # СЕКЦИЯ 2: Формула на всю ширину и высоту
  - type: LayoutBox
    margin: large
    stretchFactor: 10
    children:
      - type: TextBox
        name: formulaText
        format: string
        stretchFactor: 10

  # СЕКЦИЯ 3: Настройки (в две строки, чтобы не улетали)
  - type: LayoutBox
    margin: large
    children:
      - type: LayoutBox
        style: inline
        children:
          - type: TextBox
            name: alpha
            format: number
          - type: CheckBox
            name: autoAlpha
          - type: ComboBox
            name: lambdaSel
      - type: LayoutBox
        style: inline
        children:
          - type: TextBox
            name: nfolds
            format: number
          - type: TextBox
            name: nboot
            format: number
          - type: TextBox
            name: polyOrder
            format: number

  # СЕКЦИЯ 4: Результаты
  - type: LayoutBox
    margin: large
    style: inline
    children:
      - type: CheckBox
        name: showBeta
      - type: CheckBox
        name: showPlot
      - type: TextBox
        name: interIndex
        format: number
