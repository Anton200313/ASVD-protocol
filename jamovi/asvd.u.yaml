title: ASVD Protocol
name: asvd
jus: '3.0'
stage: 0
compilerMode: aggressive
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variable
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Independent Variables
        children:
          - type: VariablesListBox
            name: indeps
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: step
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: alpha
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: autoAlpha
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: lambdaSel
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: polyOrder
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: nboot
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: formulaText
        format: string
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: showBeta
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: interIndex
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: nfolds
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: showPlot
