name:  asvd
title: ASVD Protocol
jrs:   '1.1'

items:
    - name:  text
      title: ASVD Log
      type:  Preformatted

    - name:  metricsTable
      title: Model Performance (Bootstrap)
      type:  Table
      rows: 1
      columns:
        - name:  metric
          title: Metric
          type:  text
        - name:  value
          title: Original
          type:  number
        - name:  lower
          title: Lower CI
          type:  number
        - name:  upper
          title: Upper CI
          type:  number

    - name:  asvdTable
      title: ASVD Variable Importance (Anova SS)
      type:  Table
      columns:
        - name:  var
          title: Predictor
          type:  text
        - name:  beta
          title: Beta (Std)
          type:  number
        - name:  lmg
          title: SS Share (Raw)
          type:  number
        - name:  lmg_p
          title: Contribution %
          type:  number
        - name:  lower
          title: Lower CI
          type:  number
        - name:  upper
          title: Upper CI
          type:  number
    - name:  asvdVisual
      title: ASVD Interaction Analysis
      type:  Image
      width: 600
      height: 450
      renderFun: .renderAsvd

    - name:  elnetPlot
      title: Elastic Net MSE & Trace
      type:  Image
      width: 600
      height: 400
      renderFun: .plotElnet